name: CI

# What this gate proves: a clean clone of THIS repo — with no monorepo checkout,
# no source aliases and no locally built WASM — installs the RunAnywhere Web SDK
# from the npm registry and type-checks, lints, tests and builds the demo app.
#
# All four SDK dependencies (@runanywhere/web, @runanywhere/web-llamacpp,
# @runanywhere/web-onnx, @runanywhere/proto-ts) are published on npm, so this
# job is expected to be GREEN. A red run is a real regression — do not paper
# over it with continue-on-error.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Must stay `npm ci`, not `npm install`: vercel.json installs with
      # `npm ci`, so CI has to exercise the exact same path. `npm install`
      # silently repairs a stale package-lock.json, which would let a lock that
      # breaks every Vercel deploy sail through this gate.
      - name: Install dependencies (SDK from npm)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
